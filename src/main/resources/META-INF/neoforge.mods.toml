modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/team-abnormals/allurement/issues"
license = "https://github.com/team-abnormals/allurement/blob/main/LICENSE.txt"

[[mixins]]
    config = "allurement.mixins.json"

[[mods]]
    modId = "allurement"
    version = "${file.jarVersion}"
    logoFile = "logo.png"
    itemIcon = "minecraft:enchanted_book"
    configBackground = "minecraft:textures/block/obsidian.png"
    authors = "Team Abnormals"
    credits = "bageldotjpg, five"
    displayURL = "https://www.teamabnormals.com/mods/allurement"
    displayName = "Allurement"
    description = '''
    Allurement adds a selection of new enchantments to help diversify gear later in the game.
    Also included are some experience and enchanting tweaks, such as allowing for enchanting horse armor.
    '''

[[dependencies.allurement]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21,1.21.1)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.allurement]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.0.0,21.2.0)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.allurement]]
    modId = "blueprint"
    type = "required"
    versionRange = "[8.0.0,)"
    ordering = "AFTER"
    side = "BOTH"